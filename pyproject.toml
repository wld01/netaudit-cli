[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netaudit-cli"
version = "0.1.0"
description = "A simple CLI tool to audit network configuration files"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "typer",
    "rich",
]

[project.scripts]
netaudit = "netaudit.cli:main"

[tool.setuptools]
packages = ["netaudit"]
